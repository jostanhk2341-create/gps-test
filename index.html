
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Test</title>
</head>
<body>
<h2>اختبار GPS والإرسال التلقائي</h2>

<p>
هذه تجربة تعليمية. بعد موافقتك على تحديد الموقع،
سيتم إرسال إحداثيات جهازك تلقائياً إلى لوحة الاختبار.
</p>

<button onclick="getLocation()">موافقة وتحديد موقعي</button>

<p id="result">بانتظار موافقتك...</p>
<p id="status"></p>

<script>
const webhook = "https://webhook.site/5d7ed63c-8d26-46ea-b7bc-7d8c3af1230f";

function getLocation() {
  document.getElementById("status").textContent =
    "بانتظار إذن الموقع...";

  navigator.geolocation.getCurrentPosition(
    async function(position) {
      const coords = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      document.getElementById("result").textContent =
        "تم تحديد الموقع بنجاح.";

      document.getElementById("status").textContent =
        "جارٍ إرسال الإحداثيات تلقائياً...";

      try {
        await fetch(webhook, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify(coords)
        });

        document.getElementById("status").textContent =
          "تم إرسال طلب الاختبار. تحقق من لوحة Webhook.";
      } catch (error) {
        document.getElementById("status").textContent =
          "تعذر إرسال الطلب.";
      }
    },
    function(error) {
      document.getElementById("result").textContent =
        "لم يتم تحديد الموقع.";

      document.getElementById("status").textContent =
        "لم تتم الموافقة أو تعذر الوصول إلى GPS.";
    }
  );
}
</script>
</body>
</html>
