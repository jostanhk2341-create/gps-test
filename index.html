<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Test</title>
</head>
<body>
<h2>اختبار تحديد الموقع</h2>
<p>اضغط الزر ووافق على إذن الموقع لعرض إحداثيات جهازك.</p>

<button onclick="getLocation()">تحديد موقعي</button>
<p id="result">بانتظار التجربة...</p>

<script>
function getLocation() {
  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    result.textContent = "المتصفح لا يدعم تحديد الموقع.";
    return;
  }

  result.textContent = "جارٍ طلب الموقع...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      result.textContent =
        "Latitude: " + position.coords.latitude +
        " | Longitude: " + position.coords.longitude +
        " | Accuracy: " + position.coords.accuracy + " meters";
    },
    function(error) {
      result.textContent = "تعذر تحديد الموقع: " + error.message;
    }
  );
}
</script>
</body>
</html>
