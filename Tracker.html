
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live GPS Tracker</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  background: #101820;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 15px;
}
h2 { color: #00d9a5; }
#map {
  height: 350px;
  border-radius: 12px;
  margin: 15px 0;
}
button {
  padding: 12px 22px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
#start { background: #00d9a5; }
#stop { background: #e74c3c; color: white; }
.info {
  background: #1c2b36;
  padding: 15px;
  border-radius: 10px;
  text-align: right;
  line-height: 2;
}
</style>
</head>

<body>

<h2>LIVE GPS TRACKER</h2>
<p>نظام تحديد الموقع المباشر</p>

<button id="start" onclick="startTracking()">
بدء التتبع
</button>

<button id="stop" onclick="stopTracking()">
إيقاف التتبع
</button>

<div id="map"></div>

<div class="info">
  <div id="status">الحالة: متوقف</div>
  <div id="lat">خط العرض: --</div>
  <div id="lon">خط الطول: --</div>
  <div id="accuracy">الدقة: --</div>
  <div id="updated">آخر تحديث: --</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([33.5, 36.3], 6);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '&copy; OpenStreetMap contributors' }
).addTo(map);

let marker = null;
let circle = null;
let watchId = null;

function startTracking() {
  if (!navigator.geolocation) {
    alert("المتصفح لا يدعم GPS");
    return;
  }

  if (watchId !== null) return;

  document.getElementById("status").textContent =
    "الحالة: بانتظار الموقع والإذن";

  watchId = navigator.geolocation.watchPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const coords = [lat, lon];

      document.getElementById("status").textContent =
        "الحالة: التتبع يعمل";

      document.getElementById("lat").textContent =
        "خط العرض: " + lat.toFixed(6);

      document.getElementById("lon").textContent =
        "خط الطول: " + lon.toFixed(6);

      document.getElementById("accuracy").textContent =
        "الدقة: " + Math.round(accuracy) + " متر";

      document.getElementById("updated").textContent =
        "آخر تحديث: " + new Date().toLocaleTimeString();

      if (!marker) {
        marker = L.marker(coords).addTo(map);
        circle = L.circle(coords, {
          radius: accuracy
        }).addTo(map);
      } else {
        marker.setLatLng(coords);
        circle.setLatLng(coords);
        circle.setRadius(accuracy);
      }

      marker.bindPopup("موقعك الحالي").openPopup();
      map.setView(coords, 16);
    },

    error => {
      document.getElementById("status").textContent =
        "تعذر تحديد الموقع: " + error.message;
      stopTracking();
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.getElementById("status").textContent =
    "الحالة: متوقف";
}
</script>

</body>
</html>
