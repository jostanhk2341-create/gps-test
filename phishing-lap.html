
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Security Lab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 2px 12px #0002;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }

    button {
      background: #2457a7;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    #result {
      color: #176b37;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>مختبر تسجيل الدخول</h2>
    <p>صفحة تدريبية ببيانات وهمية فقط.</p>

    <form id="loginForm" action="#" method="post">
      <input
        type="text"
        name="username"
        placeholder="اسم تجريبي"
        autocomplete="off"
      >

      <input
        type="password"
        name="password"
        placeholder="كلمة مرور وهمية"
        autocomplete="off"
      >

      <button type="submit">تسجيل الدخول التجريبي</button>
    </form>

    <p id="result" role="status"></p>
 <button type="button" id="testRequest">
  إرسال طلب اختبار
 </button>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      result.textContent =
        "نجحت المحاكاة: لم يتم إرسال أو تخزين أي بيانات.";
      
      form.reset();
    });
  </script>
</body>
</html>
